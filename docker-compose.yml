services:
  app:
    build: .
    container_name: tsx-app
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
      - ./knowledge_docs:/app/knowledge_docs
      - ./logs:/app/logs
      - ./app.py:/app/app.py
      - ./server.py:/app/server.py
      - ./routes:/app/routes
      - ./services:/app/services
      - ./repositories:/app/repositories
      - ./utils:/app/utils
      - ./configs:/app/configs
      - ./templates:/app/templates
      - ./static:/app/static
      - ./scripts:/app/scripts
    environment:
     - OLLAMA_HOST=http://127.0.0.1:11434
     - SKIP_WARMUP=1
     - WARMUP_EMBED=0
     - FLASK_ENV=production
     # 业务时间按北京时间。POSIX 时区串 CST-8 = UTC+8，不需要镜像里装 tzdata。
     # 容器默认是 UTC，不设这行会让订单时间早 8 小时、凌晨的单子算到前一天。
     - TZ=CST-8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped