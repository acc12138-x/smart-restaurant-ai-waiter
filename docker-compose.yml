services:
  app:
    build: .
    container_name: tsx-app
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
      - ./knowledge_docs:/app/knowledge_docs
      - ./logs:/app/logs
      - ./app.py:/app/app.py
      - ./server.py:/app/server.py
      - ./routes:/app/routes
      - ./services:/app/services
      - ./repositories:/app/repositories
      - ./utils:/app/utils
      - ./configs:/app/configs
      - ./templates:/app/templates
      - ./static:/app/static
      - ./scripts:/app/scripts
    environment:
     - OLLAMA_HOST=http://192.168.0.108:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped