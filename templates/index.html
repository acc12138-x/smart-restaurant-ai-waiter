{% extends "base.html" %}
{% set active = 'home' %}
{% block content %}

<!-- ==================== Hero ==================== -->
<section class="hero-full" id="heroFull">

  <div class="hero-stage" id="heroStage">
    <div class="hero-skeleton">
      <div class="hero-skeleton-icon">🍜</div>
      <p>加载中…</p>
    </div>
  </div>

  <div class="hero-brand-tl">
    <span class="hb-line"></span>
    <span class="hb-name">同盛祥</span>
    <span class="hb-dot">·</span>
    <span class="hb-welcome">欢迎您</span>
    <span class="hb-line"></span>
  </div>

  <div class="hero-shade-bottom"></div>

  <div class="hero-dots" id="heroDots"></div>

  <div class="hero-label-bar" id="heroLabelBar"></div>

</section>

<!-- ==================== 品牌故事 ==================== -->
<section class="home-story">

  <div class="hs-head">
    <p class="hs-label">老 店</p>
    <h2 class="hs-title">一碗汤<br>三十年</h2>
  </div>

  <p class="hs-text">
    1994 年，同盛祥在西安老巷子里支起第一口汤锅。
    三十年过去，汤没变，馍没变。我们把店里翻新了一遍，
    换了暖灯和木桌，只是想让年轻人也愿意坐下来，慢慢掰完一碗馍。
  </p>

  <div class="hs-facts">
    <div class="hs-fact">
      <span class="hs-num">30</span>
      <span class="hs-lab">年老汤</span>
    </div>
    <div class="hs-fact">
      <span class="hs-num">02:00</span>
      <span class="hs-lab">深夜营业</span>
    </div>
    <div class="hs-fact">
      <span class="hs-num">28</span>
      <span class="hs-lab">味香料</span>
    </div>
  </div>

</section>

<!-- ==================== 入口 ==================== -->
<section class="home-entry">
  <a class="he-card" href="/menu">
    <span class="he-name">看看菜单</span>
    <span class="he-arrow">→</span>
  </a>
</section>

{% endblock %}
