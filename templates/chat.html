{% extends "base.html" %}
{% set active = 'chat' %}
{% block title %}AI 客服 · 同盛祥{% endblock %}
{% block content %}

<header class="page-head">
  <h1 class="page-title">问问老店</h1>
  <p class="page-sub">AI 客服 · 基于门店知识库</p>
</header>

<section class="chat-wrap">
  <div id="chatBox" class="chat-box">
    <div class="chat-msg bot">
      <div class="chat-bubble">你好，我是同盛祥的小助手。想问菜单、营业时间还是门店故事？</div>
    </div>
  </div>

  <form id="chatForm" class="chat-input-bar">
    <input id="chatInput" class="chat-input" placeholder="想问点什么…" autocomplete="off">
    <button class="chat-send" type="submit">发送</button>
  </form>
</section>

{% endblock %}

{% block script %}
<script>
(function(){
  const form  = document.getElementById('chatForm');
  const input = document.getElementById('chatInput');
  const box   = document.getElementById('chatBox');

  function addMsg(text, who){
    const wrap = document.createElement('div');
    wrap.className = 'chat-msg ' + who;
    wrap.innerHTML = `<div class="chat-bubble">${text}</div>`;
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
    return wrap;
  }

  function addOrderCard(order){
    const wrap = document.createElement('div');
    wrap.className = 'chat-msg bot';
    const itemsHtml = order.items.map(it => `
      <div class="oc-item">
        <span>${it.name} × ${it.qty}</span>
        <span>${it.subtotal} 元</span>
      </div>
    `).join('');
    wrap.innerHTML = `
      <div class="order-card">
        <div class="oc-head">
          <span class="oc-tag">订单已创建</span>
          <span class="oc-status ${order.status}">${statusText(order.status)}</span>
        </div>
        <div class="oc-id">${order.id}</div>
        <div class="oc-items">${itemsHtml}</div>
        <div class="oc-foot">
          <span>合计</span>
          <b>${order.total} 元</b>
        </div>
      </div>
    `;
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
  }

  function statusText(s){
    const map = { pending:'待付款', paid:'已付款', cooking:'制作中', done:'已完成', cancelled:'已取消' };
    return map[s] || s;
  }

  // ★ 打字机效果（关键：之前缺失这个函数）
  function typewrite(el, text, delay){
    return new Promise(resolve => {
      if (!text){ resolve(); return; }
      let i = 0;
      const timer = setInterval(() => {
        if (i >= text.length){
          clearInterval(timer);
          resolve();
          return;
        }
        el.textContent += text[i];
        i++;
        box.scrollTop = box.scrollHeight;
      }, delay);
    });
  }

  form.onsubmit = async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMsg(text, 'user');
    if (window.Track) Track.track('chat_message', { message: text });

    input.value = '';
    input.disabled = true;

    const botMsg = addMsg('', 'bot');
    const bubble = botMsg.querySelector('.chat-bubble');
    let fullText = '';
    let orderData = null;
    let intent = '';

    try {
      const token = localStorage.getItem('tsx-token') || '';
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;

      const resp = await fetch('/api/chat/stream', {
        method: 'POST',
        headers,
        body: JSON.stringify({ message: text })
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';

      while (true){
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const parts = buffer.split('\n\n');
        buffer = parts.pop() || '';

        for (const part of parts){
          const lines = part.split('\n');
          let event = 'message';
          let dataLine = '';

          for (const line of lines){
            if (line.startsWith('event: ')) event = line.slice(7).trim();
            else if (line.startsWith('data: ')) dataLine = line.slice(6);
          }
          if (!dataLine) continue;

          let payload;
          try { payload = JSON.parse(dataLine); } catch(e){ continue; }

          if (event === 'meta'){
            intent = payload.intent || '';
            if (payload.order) orderData = payload.order;
          } else if (event === 'text'){
            await typewrite(bubble, payload.text, 20);
            fullText += payload.text;
          } else if (event === 'done'){
            if (orderData){
              botMsg.remove();
              addOrderCard(orderData);
            }
          } else if (event === 'error'){
            bubble.textContent = payload.msg || '出错了';
          }
        }
      }

      if (window.Track){
        Track.track('chat_message', {
          message: text, intent: intent,
          is_order: !!orderData,
          reply: fullText.slice(0, 50),
        });
        if (orderData){
          Track.track('order_created', {
            order_id: orderData.id, total: orderData.total,
          });
        }
      }
    } catch (err) {
      bubble.textContent = '网络不太好，稍后再试';
    }

    input.disabled = false;
    input.focus();
  };
})();
</script>
{% endblock %}
