<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>{% block title %}同盛祥 · 30年老字号泡馍{% endblock %}</title>

<!-- 防闪烁：在 CSS 加载前决定 body 是否隐藏 -->
<script>
(function(){
  try {
    var m = localStorage.getItem('tsx-mode');
    if (m === 'elder') document.documentElement.classList.add('pre-elder');
  } catch(e){}
})();
</script>
<style>
  html.pre-elder body { visibility: hidden; }
</style>

<!-- 字体：Inter（拉丁）+ 中文系统字体回退 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- 模式切换按钮（右下角悬浮，永远可见） -->
<button id="modeToggle" class="mode-toggle" aria-label="切换显示模式" type="button">
  <span class="mode-icon">👁</span>
  <span class="mode-text">大字版</span>
</button>

<!-- 加载动画 -->
<div id="pageLoader" class="loader">
  <div class="loader-ring"></div>
</div>

<main class="page">
  {% block content %}{% endblock %}
</main>

<!-- 底部导航 -->
<nav class="tabbar">
  <a class="tab {% if active=='home' %}on{% endif %}" href="/">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V10.5z"/></svg>
    <span>首页</span>
  </a>
  <a class="tab {% if active=='menu' %}on{% endif %}" href="/menu">
    <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 5h16v2H4zm0 5h10v2H4zm0 5h10v2H4z"/></svg>
    <span>菜单</span>
  </a>
  <a class="tab {% if active=='location' %}on{% endif %}" href="/location">
    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    <span>门店</span>
  </a>
      <a class="tab {% if active=='chat' %}on{% endif %}" href="/chat">
    <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
    <span>问答</span>
  </a>
    <a class="tab {% if active=='profile' %}on{% endif %}" href="/profile">
  <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
  <span>我的</span>
</a>
</nav>

<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth-client.js') }}"></script>
<script src="{{ url_for('static', filename='js/track.js') }}"></script>
{% block script %}{% endblock %}
</body>
</html>
